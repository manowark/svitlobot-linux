# Авто-збірка і публікація Docker-образу в GHCR.
#
# Тригери:
#   - push у main            → тільки go vet + go test (CI-гард)
#   - push тегу v1.2.3       → збірка і публікація образу в GHCR
#                              теги: latest, 1.2.3, 1.2, 1
#   - керування вручну       → Actions → docker-publish → Run workflow
#                              (тільки тести; образ — лише з тегу)
#
# Мульти-арх без QEMU: Dockerfile крос-компілює Go на платформі білдера
# (BUILDPLATFORM/TARGETARCH, CGO вимкнено), тож linux/arm64 (Raspberry Pi 5)
# збирається нативно на amd64-ранері — швидко і без емуляції.

name: docker-publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: go vet + go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  publish:
    name: build & push image
    needs: test
    # образ публікується тільки при пуші тегу v*
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # без provenance/SBOM-атестацій: інакше GHCR показує
          # фантомні архітектури unknown/unknown у списку тегів
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image summary
        run: echo "published ${{ steps.meta.outputs.tags }}"
